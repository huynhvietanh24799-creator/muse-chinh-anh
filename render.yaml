services:
  - type: web
    name: muse-chinh-anh
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: RETENTION_HOURS
        value: "48"
      - key: REQUIRE_APPROVAL
        value: "false"
      - key: AUTO_MUSE
        value: "true"
      - key: RELIGHT_MAX_EDGE
        value: "3000"
      - key: SITE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: CLEANUP_KEY
        sync: false
